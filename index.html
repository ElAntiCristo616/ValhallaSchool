<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valhalla School">
<title>Valhalla School</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div id="app">
  <header id="topbar">
    <button id="backBtn" class="hidden" aria-label="Atrás">‹ Atrás</button>
    <div id="topTitle">⚔️ Valhalla School</div>
    <div id="topXp">⭐ <span id="topXpVal">0</span> XP</div>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="home" class="tab active">🏠<span>Inicio</span></button>
    <button data-tab="challenges" class="tab">🎯<span>Retos</span></button>
    <button data-tab="practice" class="tab">🧠<span>Práctica</span></button>
    <button data-tab="games" class="tab">🎮<span>Juegos</span></button>
    <button data-tab="profile" class="tab">👤<span>Perfil</span></button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
