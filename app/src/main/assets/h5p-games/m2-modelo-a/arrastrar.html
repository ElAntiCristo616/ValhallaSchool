<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{margin:0;background:#04070f;color:#f5efe0;font-family:sans-serif;padding:16px}
h1{color:#d9a441;font-size:22px;margin:6px 0 4px}
p.sub{color:#9aa3b2;font-size:14px;margin:0 0 16px}
button{background:#d9a441;color:#1a1400;border:none;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;margin:14px 0}
button:disabled{background:#22304a;color:#9aa3b2}
#win{display:none;background:#0d1526;border:2px solid #d9a441;border-radius:16px;padding:18px;text-align:center;margin-top:16px}
#win b{color:#d9a441;font-size:20px}
.muted{color:#9aa3b2}
</style></head><body><h1>Arrastra y clasifica: Modelo A</h1><p class="sub">Coloca cada elemento en su zona.</p><div id="items" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px"></div><div class="zone" data-zone="Ego" style="background:#0d1526;border:2px dashed #2aa198;border-radius:14px;padding:12px;margin-bottom:10px;min-height:56px"><b style="color:#2aa198">Ego</b><div class="slot"></div></div><div class="zone" data-zone="SuperEgo" style="background:#0d1526;border:2px dashed #2aa198;border-radius:14px;padding:12px;margin-bottom:10px;min-height:56px"><b style="color:#2aa198">SuperEgo</b><div class="slot"></div></div><div class="zone" data-zone="SuperId" style="background:#0d1526;border:2px dashed #2aa198;border-radius:14px;padding:12px;margin-bottom:10px;min-height:56px"><b style="color:#2aa198">SuperId</b><div class="slot"></div></div><div class="zone" data-zone="Id" style="background:#0d1526;border:2px dashed #2aa198;border-radius:14px;padding:12px;margin-bottom:10px;min-height:56px"><b style="color:#2aa198">Id</b><div class="slot"></div></div><button id="chk">Comprobar</button><p class="muted" id="st">Toca un elemento y luego toca su zona.</p><div id="win"><b>¡Completado! 🎉</b><br><span>+10 XP ganados</span></div><script>const ZONAS=["Ego", "SuperEgo", "SuperId", "Id"];const ITEMS=[{"texto": "Basica", "zona": "Ego"}, {"texto": "Creativa", "zona": "Ego"}, {"texto": "Rol", "zona": "SuperEgo"}, {"texto": "Dolorosa", "zona": "SuperEgo"}, {"texto": "Sugestiva", "zona": "SuperId"}, {"texto": "Activacion", "zona": "SuperId"}, {"texto": "Limitativa", "zona": "Id"}, {"texto": "Fondo", "zona": "Id"}];

let _won=false;
function win(){if(_won)return;_won=true;document.getElementById('win').style.display='block';
try{if(window.Android)Android.gameCompleted();}catch(e){}}

let sel=null;const box=document.getElementById('items');
ITEMS.slice().sort(()=>Math.random()-0.5).forEach(it=>{const d=document.createElement('div');d.textContent=it.texto;d.dataset.zona=it.zona;
d.style.cssText='background:#16233a;border:2px solid #d9a441;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer';
d.onclick=()=>{if(sel)sel.style.borderColor='#d9a441';sel=d;d.style.borderColor='#2aa198';};box.appendChild(d);});
document.querySelectorAll('.zone').forEach(z=>{z.onclick=()=>{if(!sel)return;z.querySelector('.slot').appendChild(sel);sel.style.borderColor='#22304a';sel=null;};});
document.getElementById('chk').onclick=()=>{let ok=0,tot=0;
document.querySelectorAll('.zone').forEach(z=>{z.querySelectorAll('.slot > div').forEach(d=>{tot++;const good=d.dataset.zona===z.dataset.zone;d.style.background=good?'#2aa198':'#ff4b4b';d.style.color=good?'#04070f':'#fff';if(good)ok++;});});
document.getElementById('st').textContent='Correctos: '+ok+' / '+ITEMS.length;
if(ok===ITEMS.length&&tot===ITEMS.length)win();};
</script></body></html>
